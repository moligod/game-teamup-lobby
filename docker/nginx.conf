map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
}

map $http_x_forwarded_port $forwarded_port {
    default $http_x_forwarded_port;
    '' $server_port;
}

map $http_x_real_ip $forwarded_real_ip {
    default $http_x_real_ip;
    '' $remote_addr;
}

map $http_x_forwarded_for $forwarded_for {
    default $http_x_forwarded_for;
    '' $remote_addr;
}

upstream game_hall_backend {
    server backend:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # This container is private. TLS, compression, rate limiting, and shared
    # proxy caching belong to the public OpenResty layer.
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65s;
    client_max_body_size 2m;
    client_body_timeout 30s;
    send_timeout 60s;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $forwarded_real_ip;
    proxy_set_header X-Forwarded-For $forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Port $forwarded_port;
    proxy_set_header X-Forwarded-Host $host;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Keep the edge and origin limit aligned with Express' collector parser.
    location ^~ /api/collector/ {
        client_max_body_size 32m;
        proxy_pass http://game_hall_backend;
    }

    # The backend accepts up to four 8 MiB evidence/review images.
    location ~ ^/api/market/uploads/(dishonesty-evidence|review-images)$ {
        client_max_body_size 34m;
        proxy_pass http://game_hall_backend;
    }

    location = /api/user/avatar {
        client_max_body_size 3m;
        proxy_pass http://game_hall_backend;
    }

    location /api/ {
        proxy_pass http://game_hall_backend;
    }

    # Avatar names are unique. Serve the read-only upload volume without
    # spending a Node connection on every image request.
    location ^~ /uploads/ {
        alias /data/uploads/;
        autoindex off;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /ws {
        proxy_pass http://game_hall_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $forwarded_real_ip;
        proxy_set_header X-Forwarded-For $forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Port $forwarded_port;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    location = /health {
        proxy_pass http://game_hall_backend;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /favicon.ico {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=604800";
    }

    location = /robots.txt {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /sitemap.xml {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
